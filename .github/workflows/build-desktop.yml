name: Build desktop applications

on:
  workflow_dispatch:
  push:
    branches: [main, data2g_integration]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: pixel-qso-linux-x86_64
          - os: windows-2022
            artifact: pixel-qso-windows-x86_64
          - os: macos-14
            artifact: pixel-qso-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PortAudio development headers on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev
      - name: Install PortAudio on macOS
        if: runner.os == 'macOS'
        run: brew install portaudio
      - name: Install build dependencies
        run: python -m pip install --upgrade pip PyInstaller .
      - name: Build desktop application
        run: python -m PyInstaller --clean --noconfirm pixelqso.spec
      - name: Package Linux / Windows output
        if: runner.os != 'macOS'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('${{ matrix.artifact }}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in Path('dist').rglob('*'):
                  if path.is_file():
                      archive.write(path, path.relative_to('dist').as_posix())
          PY
      - name: Package macOS applications
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/PixelQSO.app ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
