[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-qso"
version = "0.4.0b1"
description = "Repeated-burst digital radio image-card application"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PySide6>=6.6",
    "data2g[tnc] @ git+https://github.com/arodland/Data2G.git",
]

[project.optional-dependencies]
# Loopback audio is optional; Data2G supplies SciPy for the bundled CPU modem.
loopback = ["sounddevice>=0.4.6"]

[project.scripts]
pixel-qso = "app:main"

[tool.setuptools]
py-modules = ["app", "cardmodem", "card_ids", "snr", "receive_preview", "card_views", "ui_theme", "card_backends", "copy_combining", "modem_envelope", "backend_adapters", "card_transfer", "data2g_transport", "data2g_runtime", "data2g_receive_host", "weak_signal_modem", "weak_signal_ldpc", "weak_signal_ldpc_data", "experimental_burst_modem", "compressed_fsk_modem", "grid_fsk_modem", "experimental_fec", "webserver", "on_air"]
