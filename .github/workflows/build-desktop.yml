name: Build desktop applications

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: pixel-qso-linux-x86_64
          - os: windows-2022
            artifact: pixel-qso-windows-x86_64
          - os: macos-14
            artifact: pixel-qso-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --upgrade pip PyInstaller .
      - name: Build native application
        run: python -m PyInstaller --clean --noconfirm pixelqso.spec
      - name: Package Linux / Windows output
        if: runner.os != 'macOS'
        shell: bash
        run: |
          python -c "import pathlib, zipfile; p=pathlib.Path('dist'); out=pathlib.Path('${{ matrix.artifact }}.zip'); z=zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED); [z.write(f,f.relative_to(p)) for f in p.rglob('*') if f.is_file()]; z.close()"
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/PixelQSO.app ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
