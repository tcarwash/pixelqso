[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-qso"
version = "0.3.0"
description = "Repeated-burst digital radio image-card application"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PySide6>=6.6"]

[project.optional-dependencies]
# Keep radio/GPU extras out of the default desktop install.
loopback = ["sounddevice>=0.4.6"]
data2g = ["data2g @ git+https://github.com/arodland/Data2G.git@e5452ec185e4f864a716d3682a2ab1a90af3a951", "torch>=2.13"]
weak-signal = ["data2g @ git+https://github.com/arodland/Data2G.git@e5452ec185e4f864a716d3682a2ab1a90af3a951", "scipy>=1.10"]

[project.scripts]
pixel-qso = "app:main"

[tool.setuptools]
py-modules = ["app", "cardmodem", "card_views", "card_backends", "weak_signal_modem", "webserver"]
